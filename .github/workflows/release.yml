name: Release

# A tag v<VERSION>.<patch> on main releases that commit: two static binaries per target, the full
# build and the small build without the Console (docs/build-features.md), a .deb and an .rpm of the full
# build for x86_64 and arm64 Linux, SHA256SUMS and install.sh, then the node's container image
# (ghcr.io/rvrs-dev/rvrs, from the small builds) and the Homebrew formula.
# Actions > Release > Run workflow tags and releases the newest commit on main.
#
# rvrs-<target>.tar.gz is the full build under the name every rvrs before build features updates from,
# so it keeps that name for good.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        # The same count crates/rvrs/build.rs makes: VERSION plus the commits since it changed.
        run: |
          base="$(cat VERSION)"
          since="$(git log -1 --format=%H -- VERSION)"
          patch="$(git rev-list --count "$since..HEAD")"
          version="$base.$patch"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME is on a commit whose version is $version." >&2
            exit 1
          fi

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            deb: amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            deb: arm64
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-24.04
            run: qemu-arm
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CC_armv7_unknown_linux_musleabihf: arm-linux-gnueabihf-gcc
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: arm-linux-gnueabihf-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.target == 'armv7-unknown-linux-musleabihf'
        run: sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user
      # The small build first: the full build goes last, so target/<target>/release holds it for
      # the packages. Both archives land in dist/.
      - run: sh scripts/build.sh ${{ matrix.target }} --without console
      - run: sh scripts/build.sh ${{ matrix.target }}
      - name: Check the version
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          full="$(${{ matrix.run }} target/${{ matrix.target }}/release/rvrs --version)"
          small="$(${{ matrix.run }} target/${{ matrix.target }}/small/rvrs --version)"
          echo "$full"
          echo "$small"
          case "$full" in "rvrs $VERSION ("*")") ;; *) echo "Expected the full build of rvrs $VERSION." >&2; exit 1 ;; esac
          case "$small" in "rvrs $VERSION ("*") without console") ;; *) echo "Expected rvrs $VERSION without console." >&2; exit 1 ;; esac
      - name: Linux packages
        if: matrix.deb
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo deb -p rvrs --no-build --target ${{ matrix.target }} --deb-version "$VERSION" --output dist/
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml
          cargo generate-rpm -p crates/rvrs --target ${{ matrix.target }} --output dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: rvrs-${{ matrix.target }}
          path: dist/*

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: |
          mkdir -p dist
          cp artifacts/* install.sh dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        run: |
          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            git tag "v$VERSION" && git push origin "v$VERSION"
          fi
          gh release create "v$VERSION" dist/* --title "rvrs $VERSION" --generate-notes --verify-tag

  # The node as a container, for x86_64 and arm64, from the small builds this release made.
  image:
    needs: [version, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ghcr.io/rvrs-dev/rvrs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: The small build of each architecture
        run: |
          mkdir image
          tar -xzf artifacts/rvrs-x86_64-unknown-linux-musl-without-console.tar.gz -C image
          mv image/rvrs image/rvrs-amd64
          tar -xzf artifacts/rvrs-aarch64-unknown-linux-musl-without-console.tar.gz -C image
          mv image/rvrs image/rvrs-arm64
          cp Dockerfile image/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker buildx build image --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" --push
      - name: Check the image
        run: docker run --rm "$IMAGE:$VERSION" --help | head -3

  homebrew:
    needs: [version, release]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Update the formula in rvrs-dev/homebrew-tap
        if: env.TAP_TOKEN != ''
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/v$VERSION/SHA256SUMS" -o SHA256SUMS
          git clone "https://x-access-token:$TAP_TOKEN@github.com/rvrs-dev/homebrew-tap.git" tap
          sh scripts/formula.sh "$VERSION" SHA256SUMS > tap/Formula/rvrs.rb
          cd tap
          git config user.name "rvrs release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rvrs.rb
          git commit -m "rvrs $VERSION" && git push
      - if: env.TAP_TOKEN == ''
        run: echo "TAP_TOKEN isn't set, so the Homebrew formula stays as it was."
