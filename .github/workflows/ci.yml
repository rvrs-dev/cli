name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # CI runs rvrs and is not someone using it.
  RVRS_PULSE: '0'
  RVRS_UPDATE_CHECK: '0'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
      - run: sh -n install.sh
      - run: cargo build --locked
      - run: RVRS=target/debug/rvrs sh scripts/check-skill.sh
      # The installer people use finds the skill in this checkout.
      - run: npx -y skills add . --list | grep -q rvrs-network-diagnostics
        env:
          DISABLE_TELEMETRY: 1
          DO_NOT_TRACK: 1

  voice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Voice check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: perl scripts/check-voice.pl --diff "$BASE"
