name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # CI runs rvrs and is not someone using it.
  RVRS_PULSE: '0'
  RVRS_UPDATE_CHECK: '0'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
      - run: sh -n install.sh && sh -n node.sh
      - run: cargo build --locked
      - run: RVRS=target/debug/rvrs sh scripts/check-skill.sh
      # The installer people use finds the skill in this checkout.
      - run: npx -y skills add . --list | grep -q rvrs-network-diagnostics
        env:
          DISABLE_TELEMETRY: 1
          DO_NOT_TRACK: 1

  features:
    # Every build feature can be left out, one at a time and all together, without a warning.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: sh scripts/check-features.sh

  small-build:
    # The build without the Console, for servers and routers: under its budget and with no crate
    # that scripts/small-build.deps doesn't list, on two servers' targets and one router's.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-24.04
            run: qemu-arm
    runs-on: ${{ matrix.os }}
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CC_armv7_unknown_linux_musleabihf: arm-linux-gnueabihf-gcc
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: arm-linux-gnueabihf-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.target == 'armv7-unknown-linux-musleabihf'
        run: sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user
      - run: sh scripts/check-small-build.sh ${{ matrix.target }}
      - name: The small build runs
        run: |
          binary=target/${{ matrix.target }}/small/rvrs
          ${{ matrix.run }} $binary --version
          ${{ matrix.run }} $binary --version | grep -q ' without console$'
          ${{ matrix.run }} $binary status || true
          ${{ matrix.run }} $binary help | grep -q '^Usage'

  voice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Voice check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: perl scripts/check-voice.pl --diff "$BASE"
