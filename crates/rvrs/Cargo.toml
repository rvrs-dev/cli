[package]
name = "rvrs"
description = "See what the network is doing. traceroute and friends in one binary."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rvrs"
path = "src/main.rs"

[features]
# The build features (docs/build-features.md): every build has all of them unless it was built
# without some.
# A node names the ones it has in its heartbeat, so a name never changes. Keep `default` on one
# line: scripts/build.sh and rvrs update read it.
default = ["traceroute", "ping", "mtr", "dns", "bgp", "tcp", "mtu", "console"]
traceroute = []
ping = []
mtr = []
dns = []
bgp = []
tcp = ["traceroute"]
mtu = ["traceroute"]
console = ["dep:ratatui"]

[dependencies]
rvrs-core = { path = "../rvrs-core" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.30", optional = true }
unicode-width = "0.2"
# 3.5 brought the per-read timeout that ends a node's read of a silent stream.
ureq = "3.5"

# Linux packages, built by .github/workflows/release.yml from the static musl binary.
[package.metadata.deb]
maintainer = "rvrs <https://rvrs.dev>"
copyright = "2026 The rvrs authors"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = "traceroute, ping, MTR, dig and BGP in one binary, with the flags of the originals and a terminal UI."
section = "net"
priority = "optional"
assets = [
    ["target/release/rvrs", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/rvrs/README.md", "644"],
]

[package.metadata.generate-rpm]
summary = "traceroute, ping, MTR, dig and BGP in one binary"
assets = [
    { source = "target/release/rvrs", dest = "/usr/bin/rvrs", mode = "755" },
    { source = "../../README.md", dest = "/usr/share/doc/rvrs/README.md", mode = "644", doc = true },
]
