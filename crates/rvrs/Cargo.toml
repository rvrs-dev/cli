[package]
name = "rvrs"
description = "See what the network is doing. traceroute and friends in one binary."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rvrs"
path = "src/main.rs"

[dependencies]
rvrs-core = { path = "../rvrs-core" }
libc = "0.2"
serde_json = "1"
ratatui = "0.30"
unicode-width = "0.2"
ureq = "3"
